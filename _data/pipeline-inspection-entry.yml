  image: /assets/img/projects/Pipeline Inspection Robot/Pipeline-Robot-Side.webp
  summary: Designed a six-wheel radially expandable in-pipe inspection robot, selected motors and mechanical
    hardware, and developed Arduino/ESP32 control and a Streamlit interface for remote driving and visual
    inspection.
  challenge: Fit an adjustable six-wheel locomotion mechanism into confined pipes while generating enough
    wheel-to-wall traction for vertical movement and providing remote camera inspection.
  contributions:
  - Complete mechanical design in SolidWorks
  - DC motors, geared expansion motor, gears, bearings and screw-nut hardware selection
  - Arduino Mega programming and ESP32-CAM wireless integration
  - Streamlit interface for driving, expansion, live video, image/video capture and flashlight control
  - Hands-on wiring, assembly and prototype integration
  outcome: R&D prototype developed with mechanical design, embedded control and remote visual inspection;
    modeling, MATLAB/ADAMS simulation and FEA were performed by a collaborating undergraduate student.
