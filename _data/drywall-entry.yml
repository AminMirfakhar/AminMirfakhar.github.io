  image: /assets/img/projects/Drywall Panel Robot/Clean Robotic Construction Site.png
  summary: Electrical architecture and embedded control for a mobile drywall installation robot, including
    encoder-feedback steering, multi-axis stepper motion, network communication, and a Streamlit operator
    interface.
  challenge: Coordinate four-wheel mobile navigation and multi-axis panel manipulation through reliable
    embedded controls, sensor feedback, motion limits, and networked operator commands.
  contributions:
  - Electronic component selection and electrical wiring
  - Dual Arduino Mega control and W5100 Ethernet / UDP communication
  - AS5600 steering encoder integration through TCA9548A I²C multiplexing
  - Feedback-based steering and wheel speed / acceleration control
  - AccelStepper-based eight-axis upper-platform motion and homing
  - Streamlit operator interface and live camera controls
  - Installation command sequencing and hardware integration
  outcome: Contributed embedded-control, electrical, and operator-interface functionality to the Wall-bot
    construction-robotics system documented in an ISARC 2025 publication.
