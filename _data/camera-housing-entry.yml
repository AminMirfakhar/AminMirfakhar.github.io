  summary: Independently designed industrial camera and illumination housings, including sealed optical
    windows, air- and water-cooled variants, adjustable mounts, and manufacturing-ready details.
  challenge: Protecting machine-vision equipment in harsh mining environments while preserving optical
    performance, thermal management, serviceability, and adjustable installation.
  contributions:
  - Designed complete camera and illumination housing assemblies and adjustable mounting systems
  - Developed gasket and optical-window interfaces for IP66-oriented protection
  - Designed separate air- and water-cooled configurations
  - Created machined tube, laser-cut plate, welded, and CNC-machined component designs
  - Oversaw manufacturing and supported assembly and installation
  outcome: Housing designs supported the PelletSense and Conveyor Belt Monitoring industrial machine-vision
    systems.
