- id: hexapod
  title: 6-DOF Motion Simulator — 2.2-Ton Payload
  period: 2023–2024
  organization: DSDA
  project_type: industrial
  categories:
    - robotics
    - automation
    - mechanical-design
    - dynamic-modeling
  technologies:
    - MATLAB
    - Simulink
    - Siemens TIA Portal
    - Siemens S7-1517 PLC
    - Lenze i950
    - LabVIEW
    - Motion Control
  image: /assets/img/projects/Hexapod/AxisXtreme-1.jpg
  summary: >-
    System-level modeling, constrained geometry optimization,
    actuator and transmission sizing, PLC motion control,
    and HMI development for a 2.2-ton six-degree-of-freedom
    industrial motion simulator.
  challenge: >-
    Optimizing a high-payload Stewart–Gough platform for
    demanding motion profiles while respecting actuator
    force and velocity limits, then integrating the
    resulting system with industrial motion control.
  contributions:
    - Kinematic and dynamic modeling in MATLAB and Simulink
    - Platform geometry and motion-envelope optimization
    - Ball-screw, transmission, and servo motor sizing
    - Siemens PLC programming and motion control
    - TIA Portal and LabVIEW HMI development
    - Electrical wiring checks and actuator assembly assistance
  outcome: >-
    Engineering development of an industrial 6-DOF motion
    simulator, including mechanical system sizing,
    electromechanical component selection,
    and PLC-based motion-control integration.
  skills:
    - matlab
    - simulink
    - tia-portal
    - labview
    - siemens-s7-1517
    - lenze-i950
    - structured-text
    - ladder-logic
    - stewart-gough
