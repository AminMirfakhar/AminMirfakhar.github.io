  - Arduino Mega programming and ESP32-CAM wireless integration
  - Streamlit interface for driving, expansion, live video, image/video capture and flashlight control
  - Hands-on wiring, assembly and prototype integration
  outcome: R&D prototype developed with mechanical design, embedded control and remote visual inspection;
